<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>YouTube Shorts Hider</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>YouTube Shorts Hider</h1>
  <label class="toggle-row">
    <span>ショート動画を非表示</span>
    <span class="switch">
      <input type="checkbox" id="enabled-toggle" />
      <span class="slider"></span>
    </span>
  </label>
  <p class="note">切り替えは開いているYouTubeのタブに即時反映されます。</p>
  <script src="popup.js"></script>
</body>
</html>
